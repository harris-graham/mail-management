name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["type:feature", "status:needs-triage"]
assignees: []
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and discussions.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / users
        - Mail registration and workflow
        - Visa
        - Archive
        - Search and reports
        - Attachments / OCR
        - Email ingestion
        - Administration / database
        - Interface / translations
        - Deployment / Docker
        - Accessibility
        - Other

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - Low
        - Medium
        - High
        - Critical

  - type: textarea
    id: context
    attributes:
      label: Additional context
