# Canonical label set. `scripts/setup-github.ps1` applies these to the repository.
- name: "type:bug"
  color: "d73a4a"
  description: "Something is not working"
- name: "type:feature"
  color: "0e8a16"
  description: "New capability"
- name: "type:enhancement"
  color: "a2eeef"
  description: "Improvement to an existing capability"
- name: "type:breaking"
  color: "b60205"
  description: "Breaking change"
- name: "type:security"
  color: "ee0701"
  description: "Security related"
- name: "type:performance"
  color: "fbca04"
  description: "Performance related"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation"
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance and tooling"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "status:needs-triage"
  color: "ededed"
  description: "Awaiting triage"
- name: "status:in-progress"
  color: "1d76db"
  description: "Work in progress"
- name: "status:blocked"
  color: "b60205"
  description: "Blocked by another task"
- name: "status:stale"
  color: "808080"
  description: "No recent activity"
- name: "priority:critical"
  color: "b60205"
  description: "Must be fixed immediately"
- name: "priority:high"
  color: "d93f0b"
  description: "High priority"
- name: "priority:medium"
  color: "fbca04"
  description: "Medium priority"
- name: "priority:low"
  color: "0e8a16"
  description: "Low priority"
- name: "area:backend"
  color: "5319e7"
  description: "Express API"
- name: "area:frontend"
  color: "1d76db"
  description: "React interface"
- name: "area:database"
  color: "006b75"
  description: "PostgreSQL schema and migrations"
- name: "area:security"
  color: "ee0701"
  description: "Authentication, authorization, hardening"
- name: "area:devops"
  color: "c5def5"
  description: "CI/CD, Docker, deployment"
- name: "area:docs"
  color: "0075ca"
  description: "Documentation and guides"
- name: "area:i18n"
  color: "d4c5f9"
  description: "French and English translations"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
