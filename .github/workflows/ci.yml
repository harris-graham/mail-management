name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (lint, migrate, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mail_management_test
          POSTGRES_USER: mail
          POSTGRES_PASSWORD: mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mail -d mail_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://mail:mail@localhost:5432/mail_management_test
      JWT_SECRET: ci-only-secret-0123456789-0123456789-abcdef
      CORS_ORIGINS: http://localhost:3000
      ENABLE_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Apply migrations
        working-directory: server
        run: npm run db:migrate

      - name: Seed reference data
        working-directory: server
        run: npm run db:seed

      - name: Unit tests
        working-directory: server
        run: npm test

      - name: Smoke test API
        working-directory: server
        run: npm run smoke

  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      REACT_APP_API_URL: http://localhost:5000/api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Unit tests
        working-directory: client
        run: npm test -- --watchAll=false

      - name: Production build
        working-directory: client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-build
          path: client/build
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
